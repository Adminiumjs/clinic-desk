# SPDX-License-Identifier: AGPL-3.0-only
#
# Clinic Desk's own checks — beside `ci.yml`, which is the fleet's synced
# workflow (build, the suite, the manifest) and is never hand-edited.
#
# What only this repo needs, and why it is here:
#
#   the contract   `src/contract/contract.test.ts`: this repo's manifest and
#                  sample installed on a BUILT Adminium with the two add-ons it
#                  offers (Invoices & Receipts, Holiday calendars), on SQLite,
#                  Postgres and MySQL — the install, the sample, a receipt for
#                  an insurer drawn from the desk's door and emailed with the
#                  receipt attached, the feature switched off and on, nothing
#                  anonymous reaching it, and the update from the released
#                  0.2.0. It skips without the two checkouts; here
#                  `ADMINIUM_REQUIRE_CONTRACT=1` makes a skip a failure, so it
#                  cannot go quietly green.
#   the outline    `src/manifest/add-ons.test.ts` holds the receipt's mapping
#                  to Invoices & Receipts' own outline when the add-ons are
#                  built beside it.
#
# The add-ons checkout is taken at `ADD_ONS_REF`: the add-ons release this
# version of the app was built against (1.0.4: the receipt's date of service,
# who attended and the patient's reference). The update step reads the released
# 0.2.0 from this repo's history, so the checkout is a full one.
#
# Both product checkouts are moved out of the workspace before the suite runs:
# vitest collects every `*.test.ts` under the repo root, and the products' own
# suites are not this repo's to run.

name: contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ADD_ONS_REF: v1.0.4

jobs:
  contract:
    name: three-engine contract
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - name: Checkout (with history, for the released 0.2.0)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check out Adminium
        uses: actions/checkout@v4
        with:
          repository: MoSofi/Adminium
          path: .adminium-product

      - name: Check out the add-ons
        uses: actions/checkout@v4
        with:
          repository: Adminiumjs/add-ons
          ref: ${{ env.ADD_ONS_REF }}
          path: .add-ons

      # The e2e boot script serves the built server and the built dashboard, on
      # the engine it is asked for — the same composition `adminium start` runs.
      - name: Build Adminium (the server, the dashboard, the e2e boot)
        run: |
          cd .adminium-product
          corepack enable
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter="@adminium/e2e..."

      - name: Build the add-ons
        run: |
          cd .add-ons
          npm ci
          npm run build

      - name: Move both checkouts out of the workspace
        run: |
          mv "$GITHUB_WORKSPACE/.adminium-product" "$RUNNER_TEMP/adminium-product"
          mv "$GITHUB_WORKSPACE/.add-ons" "$RUNNER_TEMP/add-ons"

      - name: Types
        run: npx tsc -b

      - name: The suite, with the contract on three engines
        env:
          ADMINIUM_REPO: ${{ runner.temp }}/adminium-product
          ADD_ONS_REPO: ${{ runner.temp }}/add-ons
          ADMINIUM_REQUIRE_CONTRACT: "1"
          TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          TEST_MYSQL_URL: mysql://root@127.0.0.1:3306
        run: npx vitest run
